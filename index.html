<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KIJK Pantry V1.0</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#171717">
</head>


<body>

    <main class="app">

        <header class="topo">

            <div>
                <h1>KIJK Pantry</h1>
                <p>Despensa inteligente</p>
            </div>

            <div class="contador">
                <strong id="contador">0</strong>
                <span>itens</span>
            </div>

        </header>


        <section class="card">

            <div class="card-cabecalho">

                <h2>Lista de compras</h2>

                <button
                    id="botaoLimpar"
                    class="limpar"
                >
                    Limpar
                </button>

            </div>

            <div id="lista">

                <div class="estado-vazio">
                    Nenhum item na lista
                </div>

            </div>

        </section>


        <section class="acoes">

            <button
                id="botaoScanner"
                class="botao destaque"
            >
                <span class="icone">▦</span>
                Escanear produto
            </button>


            <div class="acoes-menores">

                <button
                    id="botaoCodigo"
                    class="botao"
                >
                    Digitar código
                </button>

                <button
                    id="botaoAdicionar"
                    class="botao"
                >
                    + Manual
                </button>

            </div>


            <button
                id="botaoHistorico"
                class="botao menu"
                onclick="alternarHistorico()"
            >
                Histórico
            </button>


            <button
                id="botaoProdutos"
                class="botao menu"
            >
                Produtos cadastrados
            </button>

        </section>


        <section
            id="areaHistorico"
            class="card painel-extra"
            hidden
        >

            <div class="card-cabecalho">

                <h2>Histórico</h2>

                <button
                    id="botaoLimparHistorico"
                    class="limpar"
                >
                    Limpar
                </button>

            </div>

            <div id="historicoBox"></div>

        </section>


        <section
            id="areaProdutos"
            class="card painel-extra"
            hidden
        >

            <h2>Produtos cadastrados</h2>

            <div id="produtosBox"></div>

        </section>


        <footer>
            KIJK Pantry V1.0
        </footer>

    </main>


    <div
        id="scannerModal"
        class="scanner-modal"
        hidden
    >

        <div class="scanner-conteudo">

            <h2>Escanear produto</h2>

            <p>
                Posicione o código de barras na área abaixo.
            </p>

            <div id="reader"></div>

            <button
                id="botaoFecharScanner"
                class="botao cancelar"
            >
                Cancelar
            </button>

        </div>

    </div>


    <div
        id="toast"
        class="toast"
        hidden
    ></div>


    <script
        src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    ></script>

    <script src="app.js"></script>


    <!--
        Durante o desenvolvimento continuamos sem
        Service Worker/cache para evitar versões antigas.
    -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker
                .getRegistrations()
                .then(registrations => {

                    registrations.forEach(
                        registration =>
                            registration.unregister()
                    );

                });
        }


        if ("caches" in window) {

            caches.keys().then(names => {

                names.forEach(
                    name => caches.delete(name)
                );

            });
        }

    </script>

</body>

</html>
