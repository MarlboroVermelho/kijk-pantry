<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KIJK Pantry V0.7</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#111111">
</head>

<body>

    <main class="app">

        <header class="topo">

            <div>
                <h1>KIJK Pantry</h1>

                <p class="subtitle">
                    Despensa inteligente
                </p>
            </div>

            <div class="contador-box">
                <span id="contador">0</span>
                <small>itens</small>
            </div>

        </header>


        <section class="card">

            <div class="card-topo">

                <h2>
                    Lista de compras
                </h2>

                <button
                    id="botaoLimpar"
                    class="botao-limpar"
                >
                    Limpar
                </button>

            </div>


            <div id="lista">

                <div class="lista-vazia">
                    <p>Sua lista está vazia.</p>
                </div>

            </div>

        </section>


        <button
            id="botaoAdicionar"
            class="botao-adicionar"
        >
            + Adicionar produto
        </button>


        <p class="versao">
            KIJK Pantry V0.7
        </p>

    </main>


    <script src="app.js"></script>


    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .getRegistrations()
                .then(registrations => {

                    registrations.forEach(registration => {
                        registration.unregister();
                    });

                });
        }

        if ("caches" in window) {
            caches.keys().then(names => {

                names.forEach(name => {
                    caches.delete(name);
                });

            });
        }
    </script>

</body>

</html>
