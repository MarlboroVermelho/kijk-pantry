<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KIJK Pantry V0.9</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#171717">
</head>


<body>

    <main class="app">

        <header class="topo">

            <div>
                <h1>KIJK Pantry</h1>
                <p>Despensa inteligente</p>
            </div>

            <div class="contador">
                <strong id="contador">0</strong>
                <span>itens</span>
            </div>

        </header>


        <section class="card">

            <div class="card-cabecalho">

                <h2>Lista de compras</h2>

                <button
                    id="botaoLimpar"
                    class="limpar"
                >
                    Limpar
                </button>

            </div>

            <div id="lista">
                <div class="estado-vazio">
                    Nenhum item na lista
                </div>
            </div>

        </section>


        <section class="acoes">

            <button
                id="botaoScanner"
                class="botao destaque"
            >
                <span class="icone">▦</span>
                <span>Escanear código</span>
            </button>


            <button
                id="botaoCodigo"
                class="botao"
            >
                Digitar código
            </button>


            <button
                id="botaoAdicionar"
                class="botao"
            >
                <span class="icone">+</span>
                <span>Adicionar manualmente</span>
            </button>


            <button
                id="botaoProdutos"
                class="botao discreto"
            >
                Produtos cadastrados
            </button>

        </section>


        <section
            id="areaProdutos"
            class="card produtos"
            hidden
        >

            <h2>Produtos cadastrados</h2>

            <div id="produtosBox"></div>

        </section>


        <footer>
            KIJK Pantry V0.9
        </footer>

    </main>


    <!-- SCANNER -->

    <div
        id="scannerModal"
        class="scanner-modal"
        hidden
    >

        <div class="scanner-conteudo">

            <h2>Escanear produto</h2>

            <p>
                Posicione o código de barras dentro da câmera.
            </p>

            <div id="reader"></div>

            <button
                id="botaoFecharScanner"
                class="botao fechar-scanner"
            >
                Cancelar
            </button>

        </div>

    </div>


    <script
        src="https://unpkg.com/html5-qrcode"
    ></script>

    <script src="app.js"></script>


    <!-- Mantemos cache/service worker desligado enquanto desenvolvemos -->

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .getRegistrations()
                .then(registrations => {
                    registrations.forEach(
                        registration =>
                            registration.unregister()
                    );
                });
        }

        if ("caches" in window) {
            caches.keys().then(names => {
                names.forEach(
                    name => caches.delete(name)
                );
            });
        }
    </script>

</body>
</html>
